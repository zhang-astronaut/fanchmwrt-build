name: Build FanchmWrt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时检查一次上游更新（无变化时跳过）

permissions:
  contents: write

# 同一时间只允许一个构建：新构建开始时取消进行中的旧构建，
# 避免 schedule / push / 手动触发互相堆积（旧仓库曾因此排队数小时）
concurrency:
  group: firmware-build
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream updates
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream HEAD with last built sha
        env:
          CI_EVENT: ${{ github.event_name }}
        run: bash scripts/check-upstream.sh

  build:
    name: Build firmware images
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      # 必须在 checkout 之前：该动作会清空 $GITHUB_WORKSPACE 并挂载 LVM 卷
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          # runner 镜像持续变大，16G 以下 /var/cache/apt 仍会撑满
          root-reserve-mb: 16384
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'

      - uses: actions/checkout@v4

      - name: Self check (scripts / package layout / lists)
        run: bash scripts/selfcheck.sh

      - name: Install build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget swig \
            qemu-utils jq curl
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*

      - name: Clone upstream
        run: |
          git clone --depth 1 https://github.com/fanchmwrt/fanchmwrt.git openwrt
          git -C openwrt log --oneline -1

      - name: Prepare tree (feeds / third-party packages / patches)
        run: bash scripts/prepare-tree.sh openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: defconfig + enforce package set
        run: bash scripts/enforce-config.sh openwrt

      - name: Build firmware
        run: |
          cd openwrt
          make download -j"$(nproc)"
          find dl -size -1024c -exec rm -f {} \; || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect images (img.gz / vhd / vhdx / manifest)
        run: bash scripts/collect-images.sh openwrt

      - name: Fetch SRunPy release packages
        run: bash scripts/fetch-srunpy-artifacts.sh openwrt

      - name: Record built upstream sha
        run: |
          echo "$SHA" > upstream_sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream_sha
          git commit -m "chore: built upstream $SHA [skip ci]" || true
          git push || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-images-${{ github.run_number }}
          path: openwrt/bin/targets/x86/64/images/
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: FanchmWrt build r${{ github.run_number }}
          body: |
            基于上游 fanchmwrt/fanchmwrt @ `${{ needs.check.outputs.sha }}` 自动编译。

            主要特性：
            - UA3F：TPROXY 全局 UA 改写为 FFF，含 LuCI 界面 + 开机竞态无限 respawn 修复
            - 用户会话统计（user-sessiond-ct）：UA3F TPROXY 下可用，后台 5s 采样 + dhcp 主机名
            - fwx 流量统计 TPROXY 补丁（FORWARD → PRE/POST_ROUTING，不漏计）
            - QoS：SQM（Cake/fq_codel）+ EQoS（tc-tiny）
            - 磁盘管理 luci-app-diskman（分区 / 格式化 / 挂载 / Swap）
            - Chelsio T520（kmod-cxgb4）；MT7921e/u + iwlwifi/ath9k/rtw88/rtw89 + wpad-mesh-mbedtls
            - Docker + dockerman、iStore、EasyTier、SFTP（openssh-sftp-server + dropbear）
            - SRunPy 校园网自动登录（Release 附上游 apk/ipk）
            - rootfs 4G，首次开机自动扩容

            已按终态移除：PassWall/PassWall2、xray、sing-box、旧版 qos-scripts
            （构建时对以上包做了 FORBIDDEN 断言；如需自行加回代理见 README 红线说明）
          files: openwrt/bin/targets/x86/64/images/*
